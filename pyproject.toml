[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobforge"
version = "0.2.0"
description = "A durable SQLite-backed job queue with retries, leases, and workers"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Pavan Kumar BN"}]
license = {text = "MIT"}
keywords = ["job-queue", "sqlite", "background-jobs", "workers", "reliability", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]

[project.scripts]
jobforge = "jobforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
