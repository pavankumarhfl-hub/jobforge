[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobforge"
version = "0.1.0"
description = "A durable SQLite-backed job queue"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Pavan Kumar BN"}]
license = {text = "MIT"}

[project.scripts]
jobforge = "jobforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
